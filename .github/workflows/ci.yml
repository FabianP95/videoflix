name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

  DJANGO_SECRET_KEY: ci-insecure-dummy-key

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dev dependencies
        run: pip install -r requirements.txt

      - name: Run linter
       
        run: ruff check --output-format=github --extend-ignore EXE001 .

  test:
    name: Django checks & tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:latest 
        env:
          POSTGRES_USER: videoflix_user         
          POSTGRES_PASSWORD: ci_test_password    
          POSTGRES_DB: videoflix_db             
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videoflix_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:latest  
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
    
      DB_NAME: videoflix_db         
      DB_USER: videoflix_user      
      DB_PASSWORD: ci_test_password  
      DB_HOST: localhost            
      DB_PORT: "5432"

      
      REDIS_HOST: localhost
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_LOCATION: redis://localhost:6379/1


    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

     
      - name: Generate migrations
        run: python manage.py makemigrations

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test